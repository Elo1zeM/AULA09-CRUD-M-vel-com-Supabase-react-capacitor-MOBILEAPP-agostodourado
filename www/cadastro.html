<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | Agosto Dourado</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            100: '#FFF8E1',
                            400: '#F4C430',
                            500: '#D4A017',
                            600: '#B8860B',
                            900: '#6B4E00'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-auth.js"></script>

</head>

<body class="min-h-screen bg-amber-50 flex items-center justify-center px-6">

    <div class="w-full max-w-md">

        <div class="text-center mb-8">

            <a href="index.html"
                class="text-3xl font-extrabold text-gold-900">
                AGOSTO DOURADO
            </a>

            <p class="text-gray-600 mt-2">
                Crie sua conta para participar da comunidade.
            </p>

        </div>


        <div class="bg-white rounded-3xl shadow-xl p-8">

            <h1 class="text-2xl font-bold text-gray-800 mb-6">
                Criar conta
            </h1>


            <form id="formCadastro" class="space-y-5">

                <div>

                    <label class="block font-semibold mb-2">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        required
                        placeholder="Digite seu nome"
                        class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-gold-400">

                </div>


                <div>

                    <label class="block font-semibold mb-2">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                        placeholder="Digite seu e-mail"
                        class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-gold-400">

                </div>


                <div>

                    <label class="block font-semibold mb-2">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        required
                        minlength="6"
                        placeholder="Mínimo de 6 caracteres"
                        class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-gold-400">

                </div>


                <div>

                    <label class="block font-semibold mb-2">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        required
                        minlength="6"
                        placeholder="Digite a senha novamente"
                        class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-gold-400">

                </div>


                <p id="mensagem"
                    class="hidden text-center text-sm font-semibold">
                </p>


                <button
                    type="submit"
                    class="w-full bg-gold-500 text-white py-3 rounded-xl font-bold hover:bg-gold-600 transition">

                    Criar conta

                </button>

            </form>


            <div class="flex items-center gap-3 my-6">
                <div class="flex-1 h-px bg-gray-200"></div>
                <span class="text-sm text-gray-500">ou</span>
                <div class="flex-1 h-px bg-gray-200"></div>
            </div>


            <button
                type="button"
                id="btnGoogle"
                class="w-full flex items-center justify-center gap-3 bg-white border-2 border-gray-200 text-gray-700 py-3 rounded-xl font-bold hover:border-gold-400 hover:bg-gold-100 transition">

                <svg class="w-5 h-5" viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>

                Continuar com Google

            </button>


            <p class="text-center text-gray-600 mt-6">

                Já possui uma conta?

                <a href="login.html"
                    class="text-gold-600 font-bold hover:underline">
                    Entrar
                </a>

            </p>

        </div>


        <p class="text-center text-xs text-gray-500 mt-5">
            Protótipo frontend. O cadastro será conectado ao backend posteriormente.
        </p>

    </div>

<script>

    const formCadastro =
        document.getElementById("formCadastro");

    formCadastro.addEventListener("submit", async function (event) {

        event.preventDefault();


        const nome =
            document.getElementById("nome").value.trim();

        const email =
            document.getElementById("email").value.trim().toLowerCase();

        const senha =
            document.getElementById("senha").value;

        const confirmarSenha =
            document.getElementById("confirmarSenha").value;

        const mensagem =
            document.getElementById("mensagem");


        // Verifica se as senhas são iguais

        if (senha !== confirmarSenha) {

            mensagem.textContent =
                "As senhas não são iguais.";

            mensagem.className =
                "text-center text-sm font-semibold text-red-600";

            return;
        }


        try {

            mensagem.textContent =
                "Criando sua conta...";

            mensagem.className =
                "text-center text-sm font-semibold text-gray-600";


            // Envia os dados para o backend

            const resposta = await fetch(
                "http://localhost:3000/api/cadastro",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        nome: nome,
                        email: email,
                        senha: senha
                    })
                }
            );


            const resultado = await resposta.json();


            // Se o backend retornar erro

            if (!resposta.ok) {

                mensagem.textContent =
                    resultado.erro || "Erro ao criar conta.";

                mensagem.className =
                    "text-center text-sm font-semibold text-red-600";

                return;
            }


            // Cadastro realizado

            mensagem.textContent =
                "Conta criada com sucesso!";

            mensagem.className =
                "text-center text-sm font-semibold text-green-600";


            setTimeout(() => {

                window.location.href = "login.html";

            }, 1000);


        } catch (error) {

            console.error(error);

            mensagem.textContent =
                "Não foi possível conectar ao servidor.";

            mensagem.className =
                "text-center text-sm font-semibold text-red-600";

        }

    });

</script>
    
</body>
</html>
