<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | Agosto Dourado</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            100: '#FFF8E1',
                            400: '#F4C430',
                            500: '#D4A017',
                            600: '#B8860B',
                            900: '#6B4E00'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-amber-50 flex items-center justify-center px-6">

    <div class="w-full max-w-md">

        <div class="text-center mb-8">

            <a href="index.html"
                class="text-3xl font-extrabold text-gold-900">
                AGOSTO DOURADO
            </a>

            <p class="text-gray-600 mt-2">
                Crie sua conta para participar da comunidade.
            </p>

        </div>


        <div class="bg-white rounded-3xl shadow-xl p-8">

            <h1 class="text-2xl font-bold text-gray-800 mb-6">
                Criar conta
            </h1>


            <form id="formCadastro" class="space-y-5">

                <div>

                    <label class="block font-semibold mb-2">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        required
                        placeholder="Digite seu nome"
                        class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-gold-400">

                </div>


                <div>

                    <label class="block font-semibold mb-2">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                        placeholder="Digite seu e-mail"
                        class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-gold-400">

                </div>


                <div>

                    <label class="block font-semibold mb-2">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        required
                        minlength="6"
                        placeholder="Mínimo de 6 caracteres"
                        class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-gold-400">

                </div>


                <div>

                    <label class="block font-semibold mb-2">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        required
                        minlength="6"
                        placeholder="Digite a senha novamente"
                        class="w-full border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-gold-400">

                </div>


                <p id="mensagem"
                    class="hidden text-center text-sm font-semibold">
                </p>


                <button
                    type="submit"
                    class="w-full bg-gold-500 text-white py-3 rounded-xl font-bold hover:bg-gold-600 transition">

                    Criar conta

                </button>

            </form>


            <p class="text-center text-gray-600 mt-6">

                Já possui uma conta?

                <a href="login.html"
                    class="text-gold-600 font-bold hover:underline">
                    Entrar
                </a>

            </p>

        </div>


        <p class="text-center text-xs text-gray-500 mt-5">
            Protótipo frontend. O cadastro será conectado ao backend posteriormente.
        </p>

    </div>

<script>

    const formCadastro =
        document.getElementById("formCadastro");

    formCadastro.addEventListener("submit", async function (event) {

        event.preventDefault();


        const nome =
            document.getElementById("nome").value.trim();

        const email =
            document.getElementById("email").value.trim().toLowerCase();

        const senha =
            document.getElementById("senha").value;

        const confirmarSenha =
            document.getElementById("confirmarSenha").value;

        const mensagem =
            document.getElementById("mensagem");


        // Verifica se as senhas são iguais

        if (senha !== confirmarSenha) {

            mensagem.textContent =
                "As senhas não são iguais.";

            mensagem.className =
                "text-center text-sm font-semibold text-red-600";

            return;
        }


        try {

            mensagem.textContent =
                "Criando sua conta...";

            mensagem.className =
                "text-center text-sm font-semibold text-gray-600";


            // Envia os dados para o backend

            const resposta = await fetch(
                "http://localhost:3000/api/cadastro",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        nome: nome,
                        email: email,
                        senha: senha
                    })
                }
            );


            const resultado = await resposta.json();


            // Se o backend retornar erro

            if (!resposta.ok) {

                mensagem.textContent =
                    resultado.erro || "Erro ao criar conta.";

                mensagem.className =
                    "text-center text-sm font-semibold text-red-600";

                return;
            }


            // Cadastro realizado

            mensagem.textContent =
                "Conta criada com sucesso!";

            mensagem.className =
                "text-center text-sm font-semibold text-green-600";


            setTimeout(() => {

                window.location.href = "login.html";

            }, 1000);


        } catch (error) {

            console.error(error);

            mensagem.textContent =
                "Não foi possível conectar ao servidor.";

            mensagem.className =
                "text-center text-sm font-semibold text-red-600";

        }

    });

</script>
    
</body>
</html>
